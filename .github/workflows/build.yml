#
# Test and smoke-test on every push and pull request; publish + release
# ONLY on a `v*` git tag.
#
# Platform contract (management-service):
#   - A deployable "version" == a TAG on the GHCR image. Exactly ONE
#     semver tag per git tag: no tag, no image.
#   - Single-arch linux/amd64 with provenance/sbom off: an OCI
#     attestation index would change the manifest digest the enclave
#     pins at OID 1.3.6.1.4.1.65230.3.2.
#   - Each release records that digest.

name: Build and Release container-app-attribute-verifier

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/privasys/container-app-attribute-verifier

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"; echo "$unformatted"; exit 1
          fi

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Build-contract gate: the app MUST listen on the injected $PORT,
      # serve its probe, and refuse work until configured.
      - name: Build the image
        run: docker build -t av-smoke .
      - name: Serve on the injected $PORT and stay frozen until configured
        run: |
          set -euo pipefail
          PORT=18080
          docker run -d --name av-smoke -e PORT=$PORT -p $PORT:$PORT av-smoke
          ok=0
          for _ in $(seq 1 20); do
            if curl -fs "http://localhost:$PORT/health" | grep -q '"status"'; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::The image did not serve /health on PORT=$PORT."; docker logs av-smoke || true; exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PORT/challenge")" = 503
          curl -fsS "http://localhost:$PORT/.well-known/privasys-manifest" | jq -e '.tools | length > 0' > /dev/null
          curl -fsS "http://localhost:$PORT/.well-known/jwks.json" | jq -e '.keys[0].alg == "ES256"' > /dev/null
          docker rm -f av-smoke > /dev/null 2>&1 || true
          echo "✓ serves on \$PORT, publishes its key and manifest, frozen until configured"

  build:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      # Embed privasys.json as the org.privasys.manifest OCI label so the
      # platform auto-detects the tools and the config gate.
      - name: Read privasys.json
        id: manifest
        run: echo "json=$(jq -c . privasys.json | base64 -w0)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.privasys.manifest=${{ steps.manifest.outputs.json }}
      - name: Cut GitHub Release (Measurements)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<EOF
          ## Measurements

          | Measurement | Value |
          |-------------|-------|
          | **Workload image digest** | \`${DIGEST}\` |
          | **Attestation OID** | \`1.3.6.1.4.1.65230.3.2\` |
          | **Pinned reference** | \`${IMAGE}@${DIGEST}\` |
          | **Source commit** | \`${SHA}\` |

          The enclave measures the image digest into the RA-TLS leaf at OID
          **1.3.6.1.4.1.65230.3.2**. This build also publishes
          **1.3.6.1.4.1.65230.5.4.1**, SHA-256 of the configuration in force
          (secrets excluded), and **1.3.6.1.4.1.65230.5.4.2**, the root of
          the provider-key ledger.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes --verify-tag
          fi
      - name: Summary
        run: |
          {
            echo "## ${{ steps.tag.outputs.tag }} published"
            echo
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
